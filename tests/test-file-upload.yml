name: Test file upload (single file input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file to upload
        run: |
          echo '{"hello": "world"}' > /tmp/test-upload.json
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/post'
          method: 'POST'
          file: '/tmp/test-upload.json'
      - name: Assert response is not empty
        env:
          ACTUAL: ${{ steps.action.outputs.response }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: response is empty"
            exit 1
          fi
          echo "PASS: got response"
