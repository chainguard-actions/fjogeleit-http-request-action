name: Test file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a test file to upload
        run: |
          echo "hello from test file" > /tmp/test-upload.txt
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/post'
          method: POST
          file: '/tmp/test-upload.txt'
      - name: Assert response received
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          echo "response: $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: expected a response but got empty"
            exit 1
          fi
          echo "PASS: got response with file upload"
