name: Test POST request with JSON data
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/post'
          method: 'POST'
          contentType: 'application/json'
          data: '{"key":"value","number":42}'
      - name: Assert POST response contains sent data
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: response output is empty"
            exit 1
          fi
          echo "$RESPONSE" | grep -q '"key"' || { echo "FAIL: response does not echo back key field"; exit 1; }
          echo "$RESPONSE" | grep -q '"value"' || { echo "FAIL: response does not echo back value field"; exit 1; }
          echo "PASS"
