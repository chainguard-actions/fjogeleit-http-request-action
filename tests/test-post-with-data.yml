name: Test POST request with JSON data
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/post'
          method: 'POST'
          contentType: 'application/json'
          data: '{"hello": "world", "test": true}'
      - name: Assert response is non-empty
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: response is empty"
            exit 1
          fi
          echo "PASS: got a non-empty response"
      - name: Assert response contains posted data
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          if ! echo "$RESPONSE" | grep -q '"hello"'; then
            echo "FAIL: response does not contain posted data key 'hello'"
            exit 1
          fi
          echo "PASS: response contains posted data"
      - name: Assert status is 200
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: expected status 200, got '$STATUS'"
            exit 1
          fi
          echo "PASS: status is 200"
