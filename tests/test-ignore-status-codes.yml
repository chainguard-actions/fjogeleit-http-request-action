name: Test ignoreStatusCodes prevents failure on error status
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/status/404'
          method: 'GET'
          ignoreStatusCodes: '404'
      - name: Assert action did not fail on 404
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          # The action should have succeeded (not failed) because 404 is in ignoreStatusCodes
          echo "PASS: action completed without failure despite 404 status"
