name: Test request with custom headers
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/headers'
          method: 'GET'
          customHeaders: '{"X-Custom-Header": "test-value-abc", "X-Another-Header": "another-value"}'
      - name: Assert custom headers are reflected in response
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: response output is empty"
            exit 1
          fi
          echo "$RESPONSE" | grep -qi 'X-Custom-Header' || { echo "FAIL: custom header not found in response"; exit 1; }
          echo "$RESPONSE" | grep -q 'test-value-abc' || { echo "FAIL: custom header value not found in response"; exit 1; }
          echo "PASS"
