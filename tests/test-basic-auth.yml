name: Test request with basic authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/basic-auth/testuser/testpass'
          method: 'GET'
          username: 'testuser'
          password: 'testpass'
      - name: Assert basic auth response
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: response output is empty"
            exit 1
          fi
          echo "$RESPONSE" | grep -q '"authenticated"' || { echo "FAIL: response does not contain authenticated field"; exit 1; }
          echo "$RESPONSE" | grep -q '"user"' || { echo "FAIL: response does not contain user field"; exit 1; }
          echo "PASS"
