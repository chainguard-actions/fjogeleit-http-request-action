name: Test basic authentication with username and password
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/basic-auth/testuser/testpass'
          method: 'GET'
          username: 'testuser'
          password: 'testpass'
      - name: Assert response is non-empty
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: response output is empty"
            exit 1
          fi
          echo "PASS: got a non-empty response"
      - name: Assert basic auth was accepted
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          if ! echo "$RESPONSE" | grep -q '"authenticated"'; then
            echo "FAIL: response does not contain 'authenticated' field"
            exit 1
          fi
          if ! echo "$RESPONSE" | grep -q '"user"'; then
            echo "FAIL: response does not contain 'user' field"
            exit 1
          fi
          echo "PASS: basic authentication succeeded"
