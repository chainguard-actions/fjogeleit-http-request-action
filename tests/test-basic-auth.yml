name: Test username and password inputs (basic auth)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/basic-auth/testuser/testpass'
          method: GET
          username: 'testuser'
          password: 'testpass'
      - name: Assert response received with auth success
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          echo "response: $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: expected a response but got empty"
            exit 1
          fi
          if echo "$RESPONSE" | grep -q '"authenticated": true'; then
            echo "PASS: basic auth succeeded"
          else
            echo "FAIL: expected authenticated=true in response"
            exit 1
          fi
