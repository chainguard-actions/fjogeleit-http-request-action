name: Test responseFile input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/get'
          method: GET
          responseFile: '/tmp/http-response.json'
      - name: Assert response file was created
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          echo "response: $RESPONSE"
          if [ ! -f /tmp/http-response.json ]; then
            echo "FAIL: expected response file /tmp/http-response.json to exist"
            exit 1
          fi
          FILE_CONTENT=$(cat /tmp/http-response.json)
          echo "file content: $FILE_CONTENT"
          if [ -z "$FILE_CONTENT" ]; then
            echo "FAIL: response file is empty"
            exit 1
          fi
          echo "PASS: response file created and has content"
