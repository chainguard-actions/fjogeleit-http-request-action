name: Test responseFile persists response to disk
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/get'
          method: 'GET'
          responseFile: '/tmp/http-response.json'
      - name: Assert response file was created and contains data
        env:
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: expected status 200, got $STATUS"
            exit 1
          fi
          if [ ! -f /tmp/http-response.json ]; then
            echo "FAIL: response file was not created"
            exit 1
          fi
          CONTENT=$(cat /tmp/http-response.json)
          echo "file content: $CONTENT"
          if [ -z "$CONTENT" ]; then
            echo "FAIL: response file is empty"
            exit 1
          fi
          # httpbin /get returns a JSON object with a "url" field
          if ! echo "$CONTENT" | grep -q '"url"'; then
            echo "FAIL: response file does not contain expected JSON"
            exit 1
          fi
          echo "PASS"
