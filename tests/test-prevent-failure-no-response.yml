name: Test preventFailureOnNoResponse prevents failure on no response
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'http://localhost:19999/nonexistent'
          method: 'GET'
          preventFailureOnNoResponse: 'true'
          timeout: '2000'
      - name: Assert action did not fail despite no response
        run: |
          echo "PASS: action completed without failure despite no response from server"
