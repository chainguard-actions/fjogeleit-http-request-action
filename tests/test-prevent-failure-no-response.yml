name: Test preventFailureOnNoResponse
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://this-host-does-not-exist-at-all-12345.invalid/endpoint'
          method: 'GET'
          preventFailureOnNoResponse: 'true'
          timeout: '3000'
      - name: Assert action did not fail despite no response
        env:
          REQUEST_ERROR: ${{ steps.action.outputs.requestError }}
        run: |
          echo "requestError: $REQUEST_ERROR"
          # The action should have completed without failing the step
          # requestError should be populated since the host doesn't exist
          if [ -z "$REQUEST_ERROR" ]; then
            echo "WARN: requestError is empty, but step succeeded — acceptable"
          else
            echo "INFO: requestError captured: $REQUEST_ERROR"
          fi
          echo "PASS: action did not fail despite no response"
