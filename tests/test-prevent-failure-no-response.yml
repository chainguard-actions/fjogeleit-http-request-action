name: Test preventFailureOnNoResponse on timeout
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/delay/10'
          method: 'GET'
          timeout: '500'
          preventFailureOnNoResponse: 'true'
      - name: Assert action did not fail despite timeout
        run: |
          echo "PASS: action did not fail despite request timeout (preventFailureOnNoResponse worked)"
