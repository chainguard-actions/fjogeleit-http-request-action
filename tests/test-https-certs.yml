name: Test httpsCA, httpsCert, and httpsKey inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate self-signed client cert and key
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/client.key \
            -out /tmp/client.crt -days 1 -nodes \
            -subj "/CN=test-client"
          echo "HTTPS_CERT=$(cat /tmp/client.crt)" >> $GITHUB_ENV
          echo "HTTPS_KEY=$(cat /tmp/client.key)" >> $GITHUB_ENV
          # Use the system CA bundle content for httpsCA
          # We read the ISRG Root X1 cert (Let's Encrypt root) from the system store
          # httpbin.org uses Let's Encrypt, so this should work
          # Actually, pass the full system CA bundle to ensure connectivity
          CA_CONTENT=$(cat /etc/ssl/certs/ca-certificates.crt)
          # Store to a file to avoid env var size limits
          echo "$CA_CONTENT" > /tmp/ca-bundle.pem
      - name: Set CA env var from file
        run: |
          {
            echo 'HTTPS_CA<<EOF_CA'
            cat /tmp/ca-bundle.pem
            echo 'EOF_CA'
          } >> $GITHUB_ENV
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/get'
          method: 'GET'
          httpsCA: ${{ env.HTTPS_CA }}
          httpsCert: ${{ env.HTTPS_CERT }}
          httpsKey: ${{ env.HTTPS_KEY }}
      - name: Assert response is non-empty
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: response is empty"
            exit 1
          fi
          echo "PASS: got a response with TLS cert inputs set"
