name: Test escapeData for newlines in data string
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/post'
          method: 'POST'
          contentType: 'application/json'
          data: '{"message": "line1\nline2"}'
          escapeData: 'true'
      - name: Assert POST with escaped data succeeded
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
          STATUS: ${{ steps.action.outputs.status }}
        run: |
          echo "status: $STATUS"
          echo "response: $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: response is empty"
            exit 1
          fi
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: expected status 200, got $STATUS"
            exit 1
          fi
          if ! echo "$RESPONSE" | grep -q '"message"'; then
            echo "FAIL: response does not contain message field"
            exit 1
          fi
          echo "PASS"
