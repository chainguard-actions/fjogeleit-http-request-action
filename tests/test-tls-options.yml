name: Test TLS options (httpsCA, httpsCert, httpsKey)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Generate self-signed cert for testing
        id: gencert
        run: |
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/test.key -out /tmp/test.crt \
            -days 1 -nodes -subj "/CN=localhost"
          # Export as env vars for use in next step
          echo "CERT_CONTENT<<EOF" >> $GITHUB_ENV
          cat /tmp/test.crt >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "KEY_CONTENT<<EOF" >> $GITHUB_ENV
          cat /tmp/test.key >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/get'
          method: GET
          httpsCA: ${{ env.CERT_CONTENT }}
          httpsCert: ${{ env.CERT_CONTENT }}
          httpsKey: ${{ env.KEY_CONTENT }}
        continue-on-error: true
      - name: Assert action ran with TLS inputs
        env:
          RESP: ${{ steps.action.outputs.response }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "response length: ${#RESP}"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESP" ]; then
              echo "FAIL: action succeeded but response is empty"
              exit 1
            fi
            echo "PASS: got response with TLS inputs set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with TLS inputs (cert mismatch expected for self-signed cert against httpbin.org)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
