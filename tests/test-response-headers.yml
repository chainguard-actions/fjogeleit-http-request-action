name: Test response headers output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/get'
          method: 'GET'
      - name: Assert headers output is non-empty
        env:
          HEADERS: ${{ steps.action.outputs.headers }}
        run: |
          echo "headers: $HEADERS"
          if [ -z "$HEADERS" ]; then
            echo "FAIL: headers output is empty"
            exit 1
          fi
          echo "PASS: headers output is non-empty"
      - name: Assert headers contain content-type
        env:
          HEADERS: ${{ steps.action.outputs.headers }}
        run: |
          echo "headers: $HEADERS"
          if ! echo "$HEADERS" | grep -qi 'content-type'; then
            echo "FAIL: headers do not contain 'content-type'"
            exit 1
          fi
          echo "PASS: headers contain content-type"
