name: Test basic GET request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/get'
          method: 'GET'
      - name: Assert response is non-empty
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
          HEADERS: ${{ steps.action.outputs.headers }}
        run: |
          echo "response: $RESPONSE"
          echo "headers: $HEADERS"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: response output is empty"
            exit 1
          fi
          echo "$RESPONSE" | grep -q '"url"' || { echo "FAIL: response does not contain expected 'url' field"; exit 1; }
          if [ -z "$HEADERS" ]; then
            echo "FAIL: headers output is empty"
            exit 1
          fi
          echo "PASS"
