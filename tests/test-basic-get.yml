name: Test basic GET request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/get'
          method: 'GET'
      - name: Assert response is not empty
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
          HEADERS: ${{ steps.action.outputs.headers }}
        run: |
          echo "response: $RESPONSE"
          echo "headers: $HEADERS"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: response output is empty"
            exit 1
          fi
          echo "PASS: got a response"
      - name: Assert response contains expected fields
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          if ! echo "$RESPONSE" | grep -q '"url"'; then
            echo "FAIL: response does not contain 'url' field"
            exit 1
          fi
          echo "PASS: response contains expected fields"
      - name: Assert headers output is not empty
        env:
          HEADERS: ${{ steps.action.outputs.headers }}
        run: |
          echo "headers: $HEADERS"
          if [ -z "$HEADERS" ]; then
            echo "FAIL: headers output is empty"
            exit 1
          fi
          echo "PASS: headers output is present"
