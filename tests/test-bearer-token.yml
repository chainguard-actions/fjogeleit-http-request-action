name: Test request with bearer token authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/bearer'
          method: 'GET'
          bearerToken: 'my-test-token-12345'
      - name: Assert bearer auth response
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: response output is empty"
            exit 1
          fi
          echo "$RESPONSE" | grep -q '"authenticated"' || { echo "FAIL: response does not contain authenticated field"; exit 1; }
          echo "$RESPONSE" | grep -q 'true' || { echo "FAIL: response does not show authenticated=true"; exit 1; }
          echo "PASS"
