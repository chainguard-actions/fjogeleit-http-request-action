name: Test bearer token authentication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          url: 'https://httpbin.org/bearer'
          method: 'GET'
          bearerToken: 'my-test-token-abc123'
      - name: Assert response is not empty
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          if [ -z "$RESPONSE" ]; then
            echo "FAIL: response output is empty"
            exit 1
          fi
          echo "PASS: got a response"
      - name: Assert bearer auth was accepted
        env:
          RESPONSE: ${{ steps.action.outputs.response }}
        run: |
          echo "response: $RESPONSE"
          # httpbin /bearer returns {"authenticated": true, "token": "..."} when auth header is present
          if ! echo "$RESPONSE" | grep -q '"authenticated"'; then
            echo "FAIL: response does not contain 'authenticated' field"
            exit 1
          fi
          if ! echo "$RESPONSE" | grep -q 'true'; then
            echo "FAIL: response does not indicate authenticated=true"
            exit 1
          fi
          echo "PASS: bearer token authentication succeeded"
